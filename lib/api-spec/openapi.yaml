        flatShippingRate:
          type: number
          description: Default shipping cost
        taxRate:
          type: number
          description: Tax percentage (e.g. 15 for 15%)
        taxInclusive:
          type: boolean
          description: Whether prices include tax
        facebookUrl:
          type: ["string", "null"]
        instagramUrl:
          type: ["string", "null"]
        twitterUrl:
          type: ["string", "null"]
        whatsappNumber:
          type: ["string", "null"]
        navbarBgColor:
          type: ["string", "null"]
          description: Custom hex color for the storefront navbar background
        navbarTextColor:
          type: ["string", "null"]
          description: Custom hex color for the storefront navbar text
        drawerBgColor:
          type: ["string", "null"]
          description: Custom hex color for the mobile drawer background
        drawerTextColor:
          type: ["string", "null"]
          description: Custom hex color for the mobile drawer text
        refundPolicy:
          type: ["string", "null"]
          description: Store refund/return policy text shown to customers
        heroBgImage:
          type: ["string", "null"]
          description: URL of the hero section background image
        footerBgColor:
          type: ["string", "null"]
          description: Custom hex color for the footer background
        footerTextColor:
          type: ["string", "null"]
          description: Custom hex color for the footer text
        footerPadding:
          type: ["string", "null"]
          description: Footer padding size (compact, normal, large)

    StoreSettingsUpdate:
      type: object
      properties:
        storeName:
          type: string
          minLength: 1
        tagline:
          type: string
        logoUrl:
          type: ["string", "null"]
        activeTheme:
          type: string
          enum: [classic, modern, minimal, luxury, ocean, glass, digital]
        contactEmail:
          type: string
        contactPhone:
          type: string
        address:
          type: string
        freeShippingThreshold:
          type: ["number", "null"]
        flatShippingRate:
          type: number
          minimum: 0
        taxRate:
          type: number
          minimum: 0
          maximum: 100
        taxInclusive:
          type: boolean
        facebookUrl:
          type: ["string", "null"]
        instagramUrl:
          type: ["string", "null"]
        twitterUrl:
          type: ["string", "null"]
        whatsappNumber:
          type: ["string", "null"]
        navbarBgColor:
          type: ["string", "null"]
          description: Custom hex color for the storefront navbar background
        navbarTextColor:
          type: ["string", "null"]
          description: Custom hex color for the storefront navbar text
        drawerBgColor:
          type: ["string", "null"]
          description: Custom hex color for the mobile drawer background
        drawerTextColor:
          type: ["string", "null"]
          description: Custom hex color for the mobile drawer text
        refundPolicy:
          type: ["string", "null"]
          description: Store refund/return policy text shown to customers
        heroBgImage:
          type: ["string", "null"]
          description: URL of the hero section background image
        footerBgColor:
          type: ["string", "null"]
          description: Custom hex color for the footer background
        footerTextColor:
          type: ["string", "null"]
          description: Custom hex color for the footer text
        footerPadding:
          type: ["string", "null"]
          description: Footer padding size (compact, normal, large)

    # ── Order schemas ────────────────────────────────────────────────────────

    OrderItem:
      type: object
      required: [productId, name, image, price, quantity]
      properties:
        productId:
          type: integer
        name:
          type: string
        image:
          type: string
        price:
          type: number
        quantity:
          type: integer
        isDigital:
          type: boolean
        downloadUrls:
          type: array
          items:
            type: string
        downloadLabels:
          type: array
          items:
            type: string
        productUrl:
          type: ["string", "null"]

    Order:
      type: object
      required:
        [
          id, orderNumber, customerName, customerEmail, customerPhone,
          address, status, items, subtotal, shippingCost, tax,
          discountCode, discountAmount, total, notes, createdAt,
          paymentMethod, paymentStatus
        ]
      properties:
        id:
          type: integer
        orderNumber:
          type: string
        customerName:
          type: string
        customerEmail:
          type: string
        customerPhone:
          type: string
        address:
          type: string
        status:
          type: string
          enum: [pending, processing, shipped, delivered, cancelled]
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItem"
        subtotal:
          type: number
        shippingCost:
          type: number
        tax:
          type: number
        discountCode:
          type: ["string", "null"]
        discountAmount:
          type: number
        total:
          type: number
        notes:
          type: ["string", "null"]
        trackingNumber:
          type: ["string", "null"]
          description: Shipping tracking number
        trackingUrl:
          type: ["string", "null"]
          description: Shipping carrier tracking URL
        paymentMethod:
          type: string
          enum: [cash, online]
          description: Payment method chosen by customer
        paymentStatus:
          type: string
          enum: [pending, paid, failed]
          description: Payment status for online orders
        paymentId:
          type: ["string", "null"]
          description: Moyasar payment ID
        createdAt:
          type: string
          format: date-time

    OrderInput:
      type: object
      required: [customerName, customerEmail, customerPhone, address, items]
      properties:
        customerName:
          type: string
          minLength: 1
        customerEmail:
          type: string
          minLength: 1
        customerPhone:
          type: string
        address:
          type: string
        items:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/OrderItem"
        discountCode:
          type: string
        notes:
          type: string
        paymentMethod:
          type: string
          enum: [cash, online]
          description: Payment method (defaults to cash)

    MoyasarPaymentInput:
      type: object
      required: [orderNumber, callbackUrl]
      properties:
        orderNumber:
          type: string
          minLength: 1
        callbackUrl:
          type: string
          minLength: 1

    MoyasarPaymentResponse:
      type: object
      required: [paymentUrl, paymentId]
      properties:
        paymentUrl:
          type: string
          description: URL to redirect the customer to for payment
        paymentId:
          type: string
          description: Moyasar payment ID

    PaymentCallbackResult:
      type: object
      required: [status, orderNumber]
      properties:
        status:
          type: string
          enum: [paid, failed, pending]
        orderNumber:
          type: string
        message:
          type: string

    OrderUpdate:
      type: object
      properties:
        status:
          type: string
          enum: [pending, processing, shipped, delivered, cancelled]
        notes:
          type: string
        trackingNumber:
          type: ["string", "null"]
          description: Shipping tracking number
        trackingUrl:
          type: ["string", "null"]
          description: Shipping carrier tracking URL

    # ── Customer schemas ─────────────────────────────────────────────────────

    CustomerWithStats:
      type: object
      required: [id, name, email, phone, totalOrders, totalSpent, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        phone:
          type: string
        totalOrders:
          type: integer
        totalSpent:
          type: number
        createdAt:
          type: string
          format: date-time

    CustomerUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        email:
          type: string
          minLength: 1
        phone:
          type: string

    # ── Discount schemas ─────────────────────────────────────────────────────

    Discount:
      type: object
      required: [id, code, type, value, minOrderAmount, maxUses, usedCount, expiresAt, isActive, createdAt]
      properties:
        id:
          type: integer
        code:
          type: string
        type:
          type: string
          enum: [percentage, fixed]
        value:
          type: number
        minOrderAmount:
          type: ["number", "null"]
        maxUses:
          type: ["integer", "null"]
        usedCount:
          type: integer
        expiresAt:
          type: ["string", "null"]
          format: date-time
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time

    DiscountInput:
      type: object
      required: [code, type, value]
      properties:
        code:
          type: string
          minLength: 1
        type:
          type: string
          enum: [percentage, fixed]
        value:
          type: number
          minimum: 0
        minOrderAmount:
          type: ["number", "null"]
        maxUses:
          type: ["integer", "null"]
        expiresAt:
          type: ["string", "null"]
          format: date-time
        isActive:
          type: boolean

    DiscountUpdate:
      type: object
      properties:
        code:
          type: string
          minLength: 1
        type:
          type: string
          enum: [percentage, fixed]
        value:
          type: number
          minimum: 0
        minOrderAmount:
          type: ["number", "null"]
        maxUses:
          type: ["integer", "null"]
        expiresAt:
          type: ["string", "null"]
          format: date-time
        isActive:
          type: boolean

    DiscountValidateInput:
      type: object
      required: [code, orderTotal]
      properties:
        code:
          type: string
          minLength: 1
        orderTotal:
          type: number
          minimum: 0

    # ── Review schemas ───────────────────────────────────────────────────────

    Review:
      type: object
      required: [id, productId, customerName, rating, comment, isApproved, createdAt]
      properties:
        id:
          type: integer
        productId:
          type: integer
        customerName:
          type: string
        rating:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: string
        isApproved:
          type: boolean
        createdAt:
          type: string
          format: date-time

    ReviewInput:
      type: object
      required: [productId, customerName, rating]
      properties:
        productId:
          type: integer
        customerName:
          type: string
          minLength: 1
        rating:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: string

    ReviewUpdate:
      type: object
      properties:
        isApproved:
          type: boolean
        comment:
          type: string

    # ── Analytics schemas ────────────────────────────────────────────────────

    RevenueByDay:
      type: object
      required: [date, revenue, orders]
      properties:
        date:
          type: string
        revenue:
          type: number
        orders:
          type: integer

    OrdersByStatus:
      type: object
      required: [status, count]
      properties:
        status:
          type: string
        count:
          type: integer

    AnalyticsSummary:
      type: object
      required:
        [totalOrders, totalRevenue, totalCustomers, pendingOrders,
         totalProducts, revenueByDay, ordersByStatus]
      properties:
        totalOrders:
          type: integer
        totalRevenue:
          type: number
        totalCustomers:
          type: integer
        pendingOrders:
          type: integer
        totalProducts:
          type: integer
        revenueByDay:
          type: array
          items:
            $ref: "#/components/schemas/RevenueByDay"
        ordersByStatus:
          type: array
          items:
            $ref: "#/components/schemas/OrdersByStatus"

    RevenueByMonth:
      type: object
      required: [month, revenue, orders]
      properties:
        month:
          type: string
        revenue:
          type: number
        orders:
          type: integer

    FinanceSummary:
      type: object
      required:
        [totalRevenue, thisMonthRevenue, lastMonthRevenue, avgOrderValue,
         totalOrders, revenueByMonth]
      properties:
        totalRevenue:
          type: number
        thisMonthRevenue:
          type: number
        lastMonthRevenue:
          type: number
        avgOrderValue:
          type: number
        totalOrders:
          type: integer
        revenueByMonth:
          type: array
          items:
            $ref: "#/components/schemas/RevenueByMonth"

    # ── Storage schemas ──────────────────────────────────────────────────────

    UploadUrlRequest:
      type: object
      required: [name, size, contentType]
      properties:
        name:
          type: string
          minLength: 1
          description: Original file name.
        size:
          type: integer
          minimum: 1
          description: File size in bytes.
        contentType:
          type: string
          minLength: 1
          description: MIME type of the file.
    UploadUrlResponse:
      type: object
      required: [uploadURL, objectPath]
      properties:
        uploadURL:
          type: string
          description: Presigned GCS URL for PUT upload.
        objectPath:
          type: string
          description: Normalized object path to store in DB (e.g. /objects/uploads/uuid).
        metadata:
          $ref: "#/components/schemas/UploadUrlRequest"

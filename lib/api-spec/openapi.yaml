        rating:
          type: number
        reviewCount:
          type: integer
        stock:
          type: integer
        isFeatured:
          type: boolean
        isNew:
          type: boolean
        badge:
          type: ["string", "null"]
        isDigital:
          type: boolean
        downloadUrls:
          type: array
          items:
            type: string
        downloadLabels:
          type: array
          items:
            type: string

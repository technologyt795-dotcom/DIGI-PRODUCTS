          type: string
        categoryName:
          type: string
        price:
          type: number
        compareAtPrice:
          type: ["number", "null"]
        description:
          type: string
        images:
          type: array
          items:
            type: string
        rating:
          type: number
        reviewCount:
          type: integer
        stock:
          type: integer
        isFeatured:
          type: boolean
        isNew:
          type: boolean
        badge:
          type: ["string", "null"]
        isDigital:
          type: boolean
        downloadUrls:
          type: array

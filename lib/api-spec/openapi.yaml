    Product:
      type: object
      required:
        [
          id,
          slug,
          name,
          categoryId,
          categorySlug,
          categoryName,
          price,
          compareAtPrice,
          description,
          images,
          rating,
          reviewCount,
          stock,
          isFeatured,
          isNew,
          badge,
          isDigital,
          downloadUrls,
          downloadLabels,
          createdAt,
        ]
      properties:
        id:
          type: integer
        slug:
          type: string
        name:
          type: string
        categoryId:
          type: integer
